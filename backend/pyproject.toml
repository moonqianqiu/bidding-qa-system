[project]
name = "bidqa"
version = "0.1.0"
description = "招投标智能问答机器人后端（FastAPI，纯服务端依赖，模型面全 API 化）"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "jieba>=0.42",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "neo4j>=5.25",
    "psycopg[binary]>=3.2",
    "pdfplumber>=0.11",
]

[project.scripts]
bidqa = "bidqa.cli.main:main"  # C5：cli 拆包后入口在 cli.main（包 __init__ 保持为空，AGENTS 硬约束 5）

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.14.0"]
build-backend = "uv_build"
