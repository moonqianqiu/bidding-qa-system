<!doctype html>
<html lang="zh-CN" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>招投标智能问答</title>
    <meta name="description" content="法规流程 · 业务数据 · 项目图谱" />
    <!-- hydration 前定主题（防闪白/闪错色），原 layout.tsx themeBootstrap 原样迁移 -->
    <script>
      try {
        var t = localStorage.getItem("bidqa.theme");
        var dark = t === "dark" || ((t === null || t === "system") &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-full flex flex-col">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
